services:
  threads-bot:
    container_name: threads-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
    volumes:
      - ./.env:/project/.env:ro
      - ./screenshots:/project/screenshots
      - ./stories:/project/stories
      - ./auth.json:/project/auth.json